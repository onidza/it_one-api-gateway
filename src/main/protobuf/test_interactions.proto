syntax = "proto3";

package credit.v1;

option java_package = "ru.creditbank.contract.test_interactions.v1";
option java_multiple_files = true;

service TestInteractionsService {

  // Unary RPC:
  // Unary RPC: Blocking / Async / Future Stub
  rpc UnaryTest(TestRequest)
    returns (TestResponse);

  //Client streaming
  rpc UploadFile(stream FileChunk)
    returns (UploadResult);

  //Server streaming
  rpc DownloadFile(DownloadRequest)
    returns (stream FileChunk);

  //Bidirectional streaming
  rpc Transfer(stream FileChunk)
    returns (stream TransferProgress);
}

message TestRequest {
  string message = 1;
}

message TestResponse {
  string message = 1;
}

message FileChunk {
  string file_name = 1;
  bytes data = 2;
  int32 chunk_number = 3;
  optional int64 total_bytes = 4;
}

message UploadResult {
  string file_name = 1;
  int64 total_bytes = 2;
  int32 chunks_count = 3;
}

message DownloadRequest {
  string file_name = 1;
}

message TransferProgress {
  int64 bytes_processed = 1;
  int64 total_bytes = 2;
  int32 percent = 3;
}
spring:
  application:
    name: apigateway

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show_sql: true

    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    issuer: apigateway
    access-token-ttl: 30m
    secret: ${JWT_SECRET}

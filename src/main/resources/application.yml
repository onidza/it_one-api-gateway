spring:
  application:
    name: apigateway

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show_sql: true

    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:apigateway}
    access-token-ttl: 30m
    secret: ${SECURITY_JWT_SECRET:McHowHFh9zfPUjAu6VdpgKm+zzOTzrpNmElKZana3RM=}
    refresh-token-ttl: 7d

rest:
  credit-service:
    url: ${REST_CREDIT_SERVICE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 3s
  loan-service:
    url: ${REST_LOAN_SERVICE_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 3s

test:
  credit-manager:
    email: ${TEST_CREDIT_MANAGER_EMAIL:manager@mail.ru}
    password: ${TEST_CREDIT_MANAGER_PASSWORD:Manager123}
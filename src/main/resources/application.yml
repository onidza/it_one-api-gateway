spring:
  application:
    name: apigateway

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres #.env
    password: postgres #.env

  jpa:
    hibernate:
      ddl-auto: create-drop
    show_sql: true

    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    issuer: apigateway
    access-token-ttl: 30m
    secret: McHowHFh9zfPUjAu6VdpgKm+zzOTzrpNmElKZana3RM= #.env
    refresh-token-ttl: 7d